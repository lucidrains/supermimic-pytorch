[project]
name = "supermimic-pytorch"
version = "0.0.15"
description = "Unofficial implementation of Supermimic, Scaling Humanoid Whole-Body Control with One Differentiable World Model"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'robotics',
    'world model'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "assoc-scan>=0.0.6",
    "einx>=0.4.0",
    "einops>=0.8.1",
    "ema-pytorch>=0.8.3",
    "torch>=2.5",
    "torch-einops-utils>=0.2.8",
    "x-mlps-pytorch>=0.6.14"
]

[project.urls]
Homepage = "https://pypi.org/project/supermimic-pytorch/"
Repository = "https://github.com/lucidrains/supermimic-pytorch"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "supermimic_pytorch",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["supermimic_pytorch"]
